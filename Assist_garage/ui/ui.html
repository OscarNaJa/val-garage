<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assist Garage</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>

<body>
    <div class="assist_garage">
        <div class="container_garage">
            <div class="header_garage">
                <p id="title-garage">ASSIST POUND</p>
                <p class="garage_title">SPAWN OR TRUNK</p>

                <div class="header_garage_icon">
                    <iconify-icon icon="material-symbols:garage-door-rounded"></iconify-icon>
                </div>
            </div>



            <div class="category_type">
                <div class="type_category">
                    <div class="category select_category " data-menu="all">
                        <iconify-icon icon="ic:round-grid-view" style="font-size: 1.2vh; margin-top: .1vh;"></iconify-icon>
                        <p>ALL</p>
                    </div>
                    <div class="category" data-menu='garage'>
                        <iconify-icon icon="material-symbols-light:garage-home-rounded"></iconify-icon>
                        <p>GARAGE</p>
                    </div>
                    <div class="category" data-menu='pound'>
                        <iconify-icon icon="material-symbols-light:cards-star"></iconify-icon>
                        <p>POUND</p>
                    </div>
                </div>
                <div class="box_search">
                    <iconify-icon icon="pajamas:search"></iconify-icon>
                    <input type="text" placeholder="Search..." id="search">
                </div>
            </div>

            <div class="assist_header_content">
                <span>CAR GARAGE :</span>
            </div>

            <div class="assist_content">

                <div class="car_box favorite">
                    <div class="assist_pound">
                        <iconify-icon icon="zondicons:information-outline"></iconify-icon>
                        <p>THIS VEHICLE IN POUND</p>
                    </div>
                    <div class="car_name">
                        <p>ASSIST CAR</p>
                        <p>XXX 123</p>
                        <p>SPORT</p>
                    </div>
                    <div class="car_img">
                        <img src="./img/sultan2.png" alt="">
                    </div>
                    <div class="car_console">
                        <div class="button_trunk">
                            <iconify-icon icon="mdi:bag-personal"></iconify-icon>
                        </div>
                        <div class="button_spawn">
                            <iconify-icon icon="material-symbols:garage-home-rounded"></iconify-icon>
                            <p>SPAWN</p>

                        </div>

                    </div>
                    <div class="assist_favorite_btn">
                        <iconify-icon icon="codicon:star-full"></iconify-icon>
                    </div>

                    <div class="car_health_list">
                        <div class="car_box_list">
                            <iconify-icon icon="mdi:hammer-wrench"></iconify-icon>
                            <div class="car_number">
                                <p>100</p>
                            </div>
                        </div>
                        <div class="car_box_list">
                            <iconify-icon icon="mdi:fuel-pump"></iconify-icon>
                            <div class="car_number">
                                <p>67</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="car_box car_inpound">
                    <div class="assist_pound">
                        <iconify-icon icon="zondicons:information-outline"></iconify-icon>
                        <p>THIS VEHICLE IN POUND</p>
                    </div>
                    <div class="car_name">
                        <p>ASSIST CAR</p>
                        <p>XXX 123</p>
                        <p>SPORT</p>
                    </div>
                    <div class="car_img">
                        <img src="./img/sultan2.png" alt="">
                    </div>
                    <div class="car_console">
                        <div class="button_trunk">
                            <iconify-icon icon="mdi:bag-personal"></iconify-icon>
                        </div>
                        <div class="button_spawn">
                            <iconify-icon icon="material-symbols:garage-home-rounded"></iconify-icon>
                            <p>SPAWN</p>

                        </div>

                    </div>
                    <div class="assist_favorite_btn">
                        <iconify-icon icon="codicon:star-full"></iconify-icon>
                    </div>

                    <div class="car_health_list">
                        <div class="car_box_list">
                            <iconify-icon icon="mdi:hammer-wrench"></iconify-icon>
                            <div class="car_number">
                                <p>100</p>
                            </div>
                        </div>
                        <div class="car_box_list">
                            <iconify-icon icon="mdi:fuel-pump"></iconify-icon>
                            <div class="car_number">
                                <p>67</p>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="car_box empty_block">
                    <!-- <p>EMPTY</p> -->
                    <iconify-icon icon="octicon:x-12" class="empty_icon"></iconify-icon>
                </div>

                <div class="car_box empty_block">
                    <!-- <p>EMPTY</p> -->
                    <iconify-icon icon="octicon:x-12" class="empty_icon"></iconify-icon>
                </div>
                <div class="car_box empty_block">
                    <!-- <p>EMPTY</p> -->
                    <iconify-icon icon="octicon:x-12" class="empty_icon"></iconify-icon>
                </div>
                <div class="car_box empty_block">
                    <!-- <p>EMPTY</p> -->
                    <iconify-icon icon="octicon:x-12" class="empty_icon"></iconify-icon>
                </div>
                <div class="car_box empty_block">
                    <!-- <p>EMPTY</p> -->
                    <iconify-icon icon="octicon:x-12" class="empty_icon"></iconify-icon>
                </div>
                <div class="car_box empty_block">
                    <!-- <p>EMPTY</p> -->
                    <iconify-icon icon="octicon:x-12" class="empty_icon"></iconify-icon>
                </div>








            </div>
            <div class="assist_devider">
                <p>Select your vehicle to spawn, open vehicle trunk</p>
            </div>

        </div>




    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="iconify-icon.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
